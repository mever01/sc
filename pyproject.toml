[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc"
version = "0.1.0"
description = "Automated registration on LC Waikiki using Simroute SMS API"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "playwright>=1.40.0",
    "ddddocr>=1.6.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
lcw = "src.cli:main"
sc-app = "src.cli:main"
sc = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
